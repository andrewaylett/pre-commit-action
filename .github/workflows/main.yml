on:
  pull_request:
  push:
    branches: [main, test-me-*, renovate/*]

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: self test action
      uses: $/
