name: Cached Pre-Commit
description: Validates that your commit passes all its pre-commit rules, with caching from uv.
author: Andrew Aylett
inputs:
  extra_args:
    description: options to pass to pre-commit run
    required: false
    default: '--all-files'
  pre_commit_version:
    description: the version of pre-commit to use
    required: false
    default: '4.6.2'
  pre_commit_uv_version:
    description: the version of pre-commit-uv to use
    required: false
    default: '4.3.0'
  uv_version:
    description: the version of uv to use
    required: false
    default: '0.12.24'
runs:
  using: composite
  steps:
  - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ~/.cache/pre-commit
      key: andrewaylett/pre-commit-action/${{ hashFiles('.pre-commit-config.yaml') }}/${{ github.action_ref }}
      restore-keys: |
        andrewaylett/pre-commit-action/${{ hashFiles('.pre-commit-config.yaml') }}/
        andrewaylett/pre-commit-action/
  - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    id: uv
    with:
      enable-cache: false
      cache-local-path: ~/.cache/pre-commit/uv
      version: ${{ inputs.uv_version }}
  - run: |
      # Set up and execute pre-commit
      set -eu
      echo ::group::Ensure pre-commit environment
      ${STEPS_UV_OUTPUTS_UV_PATH} tool install "pre-commit==${INPUTS_PRE_COMMIT_VERSION}" --with "pre-commit-uv==${INPUTS_PRE_COMMIT_UV_VERSION}" --cache-dir "~/.cache/pre-commit/uv"
      echo ::endgroup::
      ${STEPS_UV_OUTPUTS_UV_PATH} tool run --from "pre-commit==${INPUTS_PRE_COMMIT_VERSION}" --with "pre-commit-uv==${INPUTS_PRE_COMMIT_UV_VERSION}" --cache-dir "~/.cache/pre-commit/uv" pre-commit run --show-diff-on-failure --color=always ${INPUTS_EXTRA_ARGS}
      echo ::group::Clean pre-commit cache
      ${STEPS_UV_OUTPUTS_UV_PATH} tool run --from "pre-commit==${INPUTS_PRE_COMMIT_VERSION}" --with "pre-commit-uv==${INPUTS_PRE_COMMIT_UV_VERSION}" --cache-dir "~/.cache/pre-commit/uv" pre-commit gc
      echo ::endgroup::
      echo ::group::Clean uv cache
      ${STEPS_UV_OUTPUTS_UV_PATH} cache prune --ci
      echo ::endgroup::
    shell: bash
    env:
      STEPS_UV_OUTPUTS_UV_PATH: ${{ steps.uv.outputs.uv-path }}
      INPUTS_PRE_COMMIT_VERSION: ${{ inputs.pre_commit_version }}
      INPUTS_PRE_COMMIT_UV_VERSION: ${{ inputs.pre_commit_uv_version }}
      INPUTS_EXTRA_ARGS: ${{ inputs.extra_args }}
branding:
  icon: check-circle
  color: blue
